<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--ink:#173f44;--teal:#245e65;--teal2:#2f7a72;--gold:#f5c65a;--paper:#f5f8f7;--muted:#6c807e;--line:#dce8e5;--white:#fff}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 92% 4%,rgba(245,198,90,.20),transparent 24%),radial-gradient(circle at 8% 95%,rgba(47,122,114,.13),transparent 30%),var(--paper);color:var(--ink);font-family:'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;min-height:100%;overflow-x:hidden}button,textarea,select{font:inherit}.shell{max-width:1180px;margin:auto;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{display:flex;align-items:center;gap:11px;font-weight:900}.brandmark{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--ink),var(--teal2));display:grid;place-items:center;color:var(--gold);box-shadow:0 10px 25px rgba(23,63,68,.2)}.secure{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px}.layout{display:grid;grid-template-columns:1fr 1.45fr;gap:18px;align-items:stretch}.side{background:linear-gradient(155deg,var(--ink),var(--teal));color:#fff;border-radius:26px;padding:30px;position:relative;overflow:hidden;min-height:620px;box-shadow:0 22px 55px rgba(23,63,68,.18)}.side:before,.side:after{content:'';position:absolute;border-radius:50%;background:rgba(245,198,90,.1)}.side:before{width:230px;height:230px;left:-90px;top:-70px}.side:after{width:170px;height:170px;right:-70px;bottom:-50px}.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--gold);font-size:13px;font-weight:800}.side h1{font-size:31px;line-height:1.5;margin:20px 0 10px}.side p{color:#d9e7e4;line-height:1.9;margin:0}.benefits{display:grid;gap:11px;margin-top:28px}.benefit{display:flex;gap:11px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:12px;border-radius:15px}.bicon{min-width:38px;height:38px;border-radius:12px;background:rgba(245,198,90,.16);display:grid;place-items:center;color:var(--gold)}.privacy{position:absolute;right:30px;left:30px;bottom:26px;font-size:12px;color:#bad0cc;border-top:1px solid rgba(255,255,255,.13);padding-top:14px}.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:26px;padding:27px;box-shadow:0 22px 55px rgba(23,63,68,.1)}.step{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.stepbar{height:5px;flex:1;background:#e7efed;border-radius:99px;overflow:hidden}.stepbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--gold));border-radius:inherit}.card h2{font-size:25px;margin:16px 0 4px}.lead{margin:0 0 20px;color:var(--muted);font-size:14px}.group{margin:18px 0}.label{font-weight:900;margin-bottom:9px;display:block}.hint{font-size:12px;color:var(--muted);font-weight:500;margin-right:6px}.options{display:grid;gap:9px}.moods{grid-template-columns:repeat(4,1fr)}.choice{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:11px;cursor:pointer;transition:.18s;color:var(--ink);text-align:center}.choice:hover{transform:translateY(-2px);border-color:#9ebeb8}.choice.active{border-color:var(--teal2);background:#eef8f5;box-shadow:0 0 0 3px rgba(47,122,114,.09)}.choice .emoji{font-size:25px;display:block;margin-bottom:4px}.choice small{display:block;color:var(--muted);margin-top:3px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer;color:var(--ink)}.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}.field{width:100%;border:1.5px solid var(--line);background:#fbfdfc;border-radius:14px;padding:12px 13px;outline:none;color:var(--ink)}.field:focus{border-color:var(--teal2);box-shadow:0 0 0 3px rgba(47,122,114,.09)}textarea.field{min-height:80px;resize:vertical}.under{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}.actions{display:flex;gap:10px;margin-top:20px}.primary,.secondary{border:0;border-radius:14px;padding:12px 18px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,var(--gold),#f0b93c);color:var(--ink);box-shadow:0 9px 18px rgba(240,185,60,.25);flex:1}.secondary{background:#eef3f2;color:var(--ink)}.hidden{display:none!important}.error{color:#a24743;background:#fff2f0;border:1px solid #f0cbc6;padding:9px 12px;border-radius:12px;font-size:12px;margin-top:10px}.stage-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}.stat{display:block;text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:13px;border-radius:15px}.stat strong{display:block;font-size:28px;color:var(--gold)}
@media(max-width:850px){.shell{padding:12px}.layout{grid-template-columns:1fr}.side{min-height:auto;padding:23px}.side h1{font-size:25px}.privacy{position:static;margin-top:24px}.card{padding:20px}.moods{grid-template-columns:1fr 1fr}.secure{display:none}.actions{flex-direction:column}.secondary{order:2}}
</style></head><body><main class="shell"><header class="topbar"><div class="brand"><div class="brandmark">ص</div><span>الطالب الصامد</span></div><div class="secure" id="secure">🔒 إجاباتك تستخدم لتحسين المنصة فقط</div></header><section class="layout"><aside class="side"><span class="eyebrow" id="eyebrow"></span><h1 id="sideTitle"></h1><p id="sideText"></p><div id="sideContent"></div><div class="privacy" id="privacy"></div></aside><section class="card"><div class="step"><span id="stepText"></span><div class="stepbar"><i id="stepBar"></i></div><b id="stepNo"></b></div><h2 id="title"></h2><p class="lead" id="lead"></p><div id="form"></div><div id="error" class="error hidden"></div><div class="actions"><button class="primary" id="send"></button><button class="secondary" id="skip"></button></div></section></section></main><script>
let DATA={mode:'first',student_name:'الطالب',stage_title:'المرحلة',subject:'',grade:''};let state={rating:'easy',likes:['التصميم','الشرح'],issues:['لا توجد'],difficulty:'مناسبة',stars:4,improvements:['الأمثلة'],confidence:'نعم',lesson:'',note:''};const $=s=>document.querySelector(s);function msg(type,data={}){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},data),'*')}function height(){setTimeout(()=>msg('streamlit:setFrameHeight',{height:Math.max(document.documentElement.scrollHeight,760)}),30)}function token(){return String(Date.now())+'-'+Math.random().toString(36).slice(2)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sideFirst(){return '<div class="benefits"><div class="benefit"><div class="bicon">⚡</div><div><b>سريع وخفيف</b><br><small>بضع نقرات دون أسئلة طويلة</small></div></div><div class="benefit"><div class="bicon">🎯</div><div><b>تطوير موجّه</b><br><small>نركز على ما يحتاجه الطلبة فعلًا</small></div></div><div class="benefit"><div class="bicon">⭐</div><div><b>مكافأة مشاركة</b><br><small>تحصل على 20 نقطة مقابل المشاركة</small></div></div></div>'}function sideStage(){return '<div class="stage-stats"><div class="stat"><strong>100%</strong><small>تقدم المرحلة</small></div><div class="stat"><strong>+150</strong><small>نقطة خبرة</small></div></div><div class="benefits"><div class="benefit"><div class="bicon">🏅</div><div><b>وسام المثابر</b><br><small>أكملت جميع محتويات المرحلة</small></div></div></div>'}
function firstForm(){return `<div class="group"><span class="label">كيف وجدت استخدام المنصة؟</span><div class="options moods single-rating">${[['hard','😕','صعبة'],['okay','😐','مقبولة'],['easy','🙂','سهلة'],['excellent','🤩','ممتازة']].map(x=>`<button class="choice ${state.rating===x[0]?'active':''}" data-value="${x[0]}"><span class="emoji">${x[1]}</span><b>${x[2]}</b></button>`).join('')}</div></div><div class="group"><span class="label">ما أكثر شيء أعجبك؟ <span class="hint">يمكن اختيار أكثر من عنصر</span></span><div class="chips multi" data-key="likes">${['التصميم','التمارين','الشرح','التقدم والأوسمة'].map(x=>`<button class="chip ${state.likes.includes(x)?'active':''}" data-value="${x}">${x}</button>`).join('')}</div></div><div class="group"><span class="label">هل واجهت صعوبة؟</span><div class="chips multi" data-key="issues">${['لا توجد','إنشاء الحساب','اختيار الصف','معرفة أين أبدأ','مشكلة تقنية'].map(x=>`<button class="chip ${state.issues.includes(x)?'active':''}" data-value="${x}">${x}</button>`).join('')}</div></div><div class="group"><label class="label">هل لديك اقتراح؟ <span class="hint">اختياري</span></label><textarea class="field note" maxlength="250" placeholder="مثال: أتمنى إضافة أمثلة أكثر قبل التمارين...">${esc(state.note)}</textarea><div class="under"><span>لا تكتب كلمة المرور أو معلومات حساسة</span><span class="count">${state.note.length} / 250</span></div></div>`}
function stageForm(){return `<div class="group"><span class="label">مستوى الصعوبة</span><div class="options moods single-difficulty">${[['سهلة جدًا','🌱'],['مناسبة','🎯'],['صعبة','🧠'],['صعبة جدًا','⛰️']].map(x=>`<button class="choice ${state.difficulty===x[0]?'active':''}" data-value="${x[0]}"><span class="emoji">${x[1]}</span><b>${x[0]}</b></button>`).join('')}</div></div><div class="group"><span class="label">هل ساعدك الشرح على الفهم؟</span><div class="chips stars" style="direction:ltr;justify-content:flex-end">${[1,2,3,4,5].map(n=>`<button class="chip ${n<=state.stars?'active':''}" data-value="${n}">★</button>`).join('')}</div><div class="under"><span>تقييم الشرح</span><span class="star-value">${state.stars} من 5</span></div></div><div class="group"><span class="label">ما الذي يحتاج إلى تحسين؟ <span class="hint">اختياري</span></span><div class="chips multi" data-key="improvements">${['الشرح','الأمثلة','التمارين','مستوى الصعوبة','سرعة الصفحة'].map(x=>`<button class="chip ${state.improvements.includes(x)?'active':''}" data-value="${x}">${x}</button>`).join('')}</div></div><div class="group"><label class="label">أين واجهت أكبر صعوبة؟ <span class="hint">اختياري</span></label><select class="field lesson"><option value="">اختر درسًا أو تمرينًا</option><option>فهم المفاهيم</option><option>الأمثلة المحلولة</option><option>تمارين الكتاب</option><option>التدريب الإضافي</option></select></div><div class="group"><span class="label">هل أنت واثق من فهم المرحلة؟</span><div class="chips confidence">${['نعم، أستطيع الحل وحدي','إلى حد ما','أحتاج مراجعة'].map(x=>`<button class="chip ${state.confidence===x?'active':''}" data-value="${x}">${x}</button>`).join('')}</div></div><div class="group"><label class="label">اقتراح إضافي <span class="hint">اختياري</span></label><textarea class="field note" maxlength="250" placeholder="اكتب ما سيساعدك على فهم المرحلة بصورة أفضل...">${esc(state.note)}</textarea><div class="under"><span>ملاحظتك تصل إلى إدارة المنصة</span><span class="count">${state.note.length} / 250</span></div></div>`}
function render(){const stage=DATA.mode==='stage';$('#secure').textContent=stage?'تم حفظ تقدمك تلقائيًا ✓':'🔒 إجاباتك تستخدم لتحسين المنصة فقط';$('#eyebrow').textContent=stage?'🏆 إنجاز جديد':'✦ دقيقة واحدة فقط';$('#sideTitle').innerHTML=stage?`أحسنت ${esc(DATA.student_name)}!<br>أنهيت ${esc(DATA.stage_title)}`:'ساعدنا لنصنع لك تجربة تعلم أفضل';$('#sideText').textContent=stage?'كل خطوة تكملها تقرّبك من إتقان المادة. قيّم المرحلة لنحسن الشرح والتمارين القادمة.':'رأيك الأول مهم. أخبرنا عمّا أعجبك وما يمكننا تحسينه دون أن يوقف ذلك رحلتك التعليمية.';$('#sideContent').innerHTML=stage?sideStage():sideFirst();$('#privacy').textContent=stage?'تقييمك لا يؤثر في نتيجتك، ويمكنك متابعة المرحلة التالية دون تقييم.':'يمكنك الضغط على «لاحقًا» والعودة إلى التعلم مباشرة.';$('#stepText').textContent=stage?'تقييم المرحلة':'تجربتك الأولى';$('#stepBar').style.width=stage?'100%':'36%';$('#stepNo').textContent=stage?'مكتملة':'1/1';$('#title').textContent=stage?'كيف كانت هذه المرحلة؟ 🎉':'كيف كانت بدايتك معنا؟ 🌟';$('#lead').textContent=stage?'ساعدنا على معرفة ما نجح وما يحتاج إلى شرح أوضح.':'اختر ما يعبّر عن تجربتك. لا توجد إجابة صحيحة أو خاطئة.';$('#form').innerHTML=stage?stageForm():firstForm();$('#send').textContent=stage?'إرسال والانتقال للمرحلة التالية':'إرسال التقييم · +20 XP';$('#skip').textContent=stage?'متابعة دون تقييم':'لاحقًا';wire();height()}
function wire(){document.querySelectorAll('.single-rating .choice').forEach(x=>x.onclick=()=>{state.rating=x.dataset.value;render()});document.querySelectorAll('.single-difficulty .choice').forEach(x=>x.onclick=()=>{state.difficulty=x.dataset.value;render()});document.querySelectorAll('.multi').forEach(box=>box.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{const key=box.dataset.key,arr=state[key]||[],v=x.dataset.value;state[key]=arr.includes(v)?arr.filter(y=>y!==v):[...arr,v];render()}));document.querySelectorAll('.stars .chip').forEach(x=>x.onclick=()=>{state.stars=+x.dataset.value;render()});document.querySelectorAll('.confidence .chip').forEach(x=>x.onclick=()=>{state.confidence=x.dataset.value;render()});const note=$('.note');if(note)note.oninput=()=>{state.note=note.value;$('.count').textContent=state.note.length+' / 250';height()};const lesson=$('.lesson');if(lesson){lesson.value=state.lesson;lesson.onchange=()=>state.lesson=lesson.value}}
$('#send').onclick=()=>msg('streamlit:setComponentValue',{value:{action:'submit_feedback',token:token(),feedback:state},dataType:'json'});$('#skip').onclick=()=>msg('streamlit:setComponentValue',{value:{action:'skip_feedback',token:token()},dataType:'json'});window.addEventListener('message',e=>{if(e.data&&e.data.type==='streamlit:render'){DATA=Object.assign(DATA,(e.data.args&&e.data.args.data)||{});render()}});msg('streamlit:componentReady',{apiVersion:1});render();
</script></body></html>
